name: research
on:
  schedule:
    - cron: "0 2 * * *"   # 7:00 AM Pakistan time
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agent
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python research.py
      - run: |
          git config user.name "agent"
          git config user.email "agent@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "daily products" && git pull --rebase && git push)
