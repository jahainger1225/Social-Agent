name: post
on:
  schedule: # Five daily preparation runs, Pakistan time (UTC+5)
    - cron: "0 8 * * *"   # 1:00 PM PKT
    - cron: "0 11 * * *"  # 4:00 PM PKT
    - cron: "0 14 * * *"  # 7:00 PM PKT
    - cron: "0 17 * * *"  # 10:00 PM PKT
    - cron: "0 20 * * *"  # 1:00 AM PKT
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test mode (publish nahi karega)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: agent
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "agent"
          git config user.email "agent@users.noreply.github.com"
      - run: python post.py post
        env:
          # Scheduled runs are preview-only. Live publishing requires a manual run with dry_run unchecked.
          DRY_RUN: ${{ github.event_name == 'schedule' && '1' || (inputs.dry_run && '1' || '0') }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.workflow }}-preview
          path: out/
          if-no-files-found: warn
