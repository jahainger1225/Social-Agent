name: post
on:
  schedule:            # UTC times. Warm-up: pehle hafte sirf 1 line rakhein, baqi hata dein.
    - cron: "0 8 * * *"    # 1:00 PM Pakistan
    - cron: "0 11 * * *"   # 4:00 PM Pakistan
    - cron: "0 15 * * *"   # 8:00 PM Pakistan
    - cron: "0 19 * * *"   # 12:00 AM Pakistan
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test mode (publish nahi karega)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: agent
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "agent"
          git config user.email "agent@users.noreply.github.com"
      - run: python post.py post
        env:
          # Scheduled runs stay in preview mode; live publishing only via manual dispatch with dry_run unchecked.
          DRY_RUN: ${{ github.event_name == 'schedule' && '1' || (inputs.dry_run && '1' || '0') }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.dry_run }}
        with:
          name: preview
          path: out/
